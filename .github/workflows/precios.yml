# Actualiza data/precios.json cada domingo a las 05:00 (hora de Madrid).
# También se puede lanzar a mano: pestaña Actions > Actualizar precios > Run workflow.
name: Actualizar precios

on:
  schedule:
    # GitHub usa hora UTC. Las 05:00 de Madrid son las 03:00 UTC en verano y las 04:00 UTC en invierno,
    # así que se programan las dos y el paso "Comprobar hora" deja seguir solo la que toca.
    - cron: "0 3 * * 0"
    - cron: "0 4 * * 0"
    # Cada día a las 06:30 UTC: solo las zonas nuevas que han pedido los usuarios
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Comprobar hora
        id: hora
        run: |
          offset=$(TZ=Europe/Madrid date +%z)   # +0200 en verano, +0100 en invierno
          seguir=true
          solo_nuevas=0
          if [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then solo_nuevas=1; fi
          echo "solo_nuevas=$solo_nuevas" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$solo_nuevas" = "0" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * 0" ] && [ "$offset" != "+0200" ]; then seguir=false; fi
            if [ "${{ github.event.schedule }}" = "0 4 * * 0" ] && [ "$offset" != "+0100" ]; then seguir=false; fi
          fi
          echo "Hora de Madrid: $(TZ=Europe/Madrid date '+%A %H:%M') ($offset). Seguir: $seguir"
          echo "seguir=$seguir" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'true'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'true'
        with:
          python-version: "3.12"

      - name: Consultar precios en Mercadona
        if: steps.hora.outputs.seguir == 'true'
        env:
          # Lista de códigos postales separados por comas; el primero es la zona principal
          CODIGOS_POSTALES: ${{ vars.CODIGOS_POSTALES || vars.CODIGO_POSTAL }}
          ZONAS_URL: https://taper-avisos.taper-david.workers.dev/zonas
          SOLO_NUEVAS: ${{ steps.hora.outputs.solo_nuevas }}
        run: python scripts/actualizar_precios.py

      - name: Consultar precios en otros supermercados
        if: steps.hora.outputs.seguir == 'true' && steps.hora.outputs.solo_nuevas != '1'
        # Si alguno falla (la web cambia o nos bloquea), se conservan sus últimos precios y se sigue
        continue-on-error: true
        env:
          CODIGOS_POSTALES: ${{ vars.CODIGOS_POSTALES || vars.CODIGO_POSTAL }}
        run: python scripts/actualizar_supers.py

      - name: Festivos locales de Cataluña
        if: steps.hora.outputs.seguir == 'true' && steps.hora.outputs.solo_nuevas != '1'
        continue-on-error: true
        run: python scripts/actualizar_festivos.py

      - name: Guardar los precios si han cambiado
        if: steps.hora.outputs.seguir == 'true'
        run: |
          git add data/precios.json data/zonas.json
          if [ -f data/precios_supers.json ]; then git add data/precios_supers.json; fi
          git add data/festivos.json
          if [ -d data/precios ]; then git add data/precios; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Precios de los supermercados del $(TZ=Europe/Madrid date +%Y-%m-%d)"
          # Si mientras tanto se ha subido otra cosa al repositorio, se pone al día y vuelve a intentarlo
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((intento * 10))
          done
          exit 1
