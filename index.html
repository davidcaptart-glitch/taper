<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Táper</title>
<meta name="theme-color" content="#D22F2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<meta name="description" content="Menú semanal, tápers, lista de la compra y precios del súper, a tu medida.">
<link rel="stylesheet" href="css/app.css?v=72">
<link rel="stylesheet" href="css/esteticas.css?v=72">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Táper</h1>
      <div class="row" style="flex-wrap:nowrap;gap:8px">
        <div class="monthnav">
          <button id="prevM" aria-label="Mes anterior">‹</button>
          <span id="monthLabel"></span>
          <button id="nextM" aria-label="Mes siguiente">›</button>
        </div>
        <button class="bell" id="bell" aria-label="Avisos pendientes" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="bdg" id="bellN"></span></button>
      </div>
    </div>
    <div class="ticket" aria-live="polite" hidden>
      <div class="row"><span class="big" id="spent">0 €</span><span class="of" id="budgetOf"></span></div>
      <div class="bar" id="bar"><i style="width:0"></i></div>
      <div class="note" id="budgetNote"></div>
    </div>
    <div class="pricedate" id="priceDate"></div>
  </header>
  <main id="main"><p class="loading">Cargando…</p></main>
</div>
<nav class="tabs" aria-label="Secciones" hidden><div class="in">
  <button data-tab="menu"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>Menú</button>
  <button data-tab="compra"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.1 10.1a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L20.5 8.5H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg></span>Compra</button>
  <button data-tab="congelador"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M20.2 7.2 3.8 16.8M9 4.3l3 2 3-2M9 19.7l3-2 3 2M4.3 11 6 12l-1.7 1M19.7 11 18 12l1.7 1"/></svg></span>Congelador</button>
  <button data-tab="recetas"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h11a2.5 2.5 0 0 1 2.5 2.5v14.5H8.5A2.5 2.5 0 0 1 6 18z"/><path d="M6 18a2.5 2.5 0 0 1 2.5-2.5h11M10 8h6M10 11.5h4"/></svg></span>Recetas</button>
  <button data-tab="perfil"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></span>Perfil</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="js/base.js?v=72"></script>
<script src="js/datos.js?v=72"></script>
<script src="js/fotos.js?v=72"></script>
<script src="js/gustos.js?v=72"></script>
<script src="js/plan.js?v=72"></script>
<script src="js/compra.js?v=72"></script>
<script src="js/tickets.js?v=72"></script>
<script src="js/congelador.js?v=72"></script>
<script src="js/avisos.js?v=72"></script>
<script src="js/compartir.js?v=72"></script>
<script src="js/casa.js?v=72"></script>
<script src="js/bienvenida.js?v=72"></script>
<script src="js/ui.js?v=72"></script>
</body>
</html>
