<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Táper</title>
<meta name="theme-color" content="#D22F2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<meta name="description" content="Menú semanal, tápers, lista de la compra y precios del súper, a tu medida.">
<link rel="stylesheet" href="css/app.css?v=122">
<link rel="stylesheet" href="css/esteticas.css?v=122">
</head>
<body>
<!-- Pantalla de entrada: se ve mientras se abre la app (recetas, precios, menú al día) y se va sola -->
<div class="prep entry" id="entry" role="status" aria-live="polite"><div class="prepin">
  <h2 class="wh">Entrando en <em>Táper</em></h2><p>Un segundo, abro tu cocina.</p>
  <div class="entart" aria-hidden="true"><div class="tlid"></div><div class="tbox"></div><span>🥦</span><span>🍅</span><span>🧀</span><span>🍗</span></div>
  <div class="prepbar loop"><i></i></div><p class="prepmsg"><span class="dot"></span><span id="entryTxt">Abriendo tu táper…</span></p></div></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Táper</h1>
      <div class="row" style="flex-wrap:nowrap;gap:8px">
        <div class="monthnav">
          <button id="prevM" aria-label="Mes anterior">‹</button>
          <span id="monthLabel"></span>
          <button id="nextM" aria-label="Mes siguiente">›</button>
        </div>
        <button class="avatar" id="avatar" aria-label="Tu perfil"></button>
        <button class="bell" id="bell" aria-label="Avisos pendientes" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="bdg" id="bellN"></span></button>
      </div>
    </div>
    <div class="ticket" aria-live="polite" hidden>
      <div class="row"><span class="big" id="spent">0 €</span><span class="of" id="budgetOf"></span></div>
      <div class="bar" id="bar"><i style="width:0"></i></div>
      <div class="note" id="budgetNote"></div>
    </div>
    <div class="pricedate" id="priceDate"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Secciones" hidden><div class="in">
  <button data-tab="hoy"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span>Hoy</button>
  <button data-tab="menu"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>Mes</button>
  <button data-tab="compra"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.1 10.1a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L20.5 8.5H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg></span>Compra</button>
  <button data-tab="despensa"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M9.5 21v-6h5v6"/></svg></span>En casa</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="js/base.js?v=122"></script>
<script src="js/iconos.js?v=122"></script>
<script src="js/datos.js?v=122"></script>
<script src="js/fotos.js?v=122"></script>
<script src="js/gustos.js?v=122"></script>
<script src="js/plan.js?v=122"></script>
<script src="js/compra.js?v=122"></script>
<script src="js/tickets.js?v=122"></script>
<script src="js/congelador.js?v=122"></script>
<script src="js/despensa.js?v=122"></script>
<script src="js/preparacion.js?v=122"></script>
<script src="js/historial.js?v=122"></script>
<script src="js/avisos.js?v=122"></script>
<script src="js/compartir.js?v=122"></script>
<script src="js/casa.js?v=122"></script>
<script src="js/bienvenida.js?v=122"></script>
<script src="js/hoy.js?v=122"></script>
<script src="js/mes.js?v=122"></script>
<script src="js/semana.js?v=122"></script>
<script src="js/encasa.js?v=122"></script>
<script src="js/pedido.js?v=122"></script>
<script src="js/comedor.js?v=122"></script>
<script src="js/postre.js?v=122"></script>
<script src="js/caduca.js?v=122"></script>
<script src="js/ui.js?v=122"></script>
</body>
</html>
