<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Táper</title>
<meta name="theme-color" content="#E4482B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2533; --muted:#5D6B7C; --line:#D9DEE5;
  --tomato:#E4482B; --tomato-ink:#FFFFFF; --carga:#F0A63A; --carga-bg:#FDF0DA; --ligera:#2F7A55; --ligera-bg:#E1F1E8;
  --kid:#5B5BD6; --kid-bg:#E8E8FB; --warn:#C0341D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111720; --surface:#1A222D; --ink:#E9EDF2; --muted:#9AA7B6; --line:#2B3542;
    --tomato:#F2603F; --carga:#F3B457; --carga-bg:#3A2D17; --ligera:#5FC18E; --ligera-bg:#16302A;
    --kid:#9C9CF5; --kid-bg:#26264A; --warn:#FF7A60;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111720; --surface:#1A222D; --ink:#E9EDF2; --muted:#9AA7B6; --line:#2B3542;
  --tomato:#F2603F; --carga:#F3B457; --carga-bg:#3A2D17; --ligera:#5FC18E; --ligera-bg:#16302A;
  --kid:#9C9CF5; --kid-bg:#26264A; --warn:#FF7A60;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Cabecera: el ticket del presupuesto */
.top{padding:20px 0 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:1.3rem}
.monthnav button:hover{background:var(--line)}
.monthnav span{font-weight:700;min-width:8.5em;text-align:center;text-transform:capitalize}
.ticket{margin-top:14px;background:var(--surface);border-radius:4px;padding:18px 18px 22px;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;
          mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x}
.ticket .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket .big{font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ticket .of{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ligera);border-radius:5px;transition:width .4s}
.bar.over i{background:var(--warn)}
.ticket .note{margin-top:8px;color:var(--muted);font-size:.92rem}
.ticket .note.over{color:var(--warn);font-weight:700}
.pricedate{margin-top:6px;color:var(--muted);font-size:.86rem}
.pricedate b{color:var(--ink)}
.up{color:var(--warn);font-weight:700;font-size:.8rem;white-space:nowrap}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:12px 4px 14px;font-weight:700;color:var(--muted);font-size:.95rem}
nav.tabs button[aria-current="page"]{color:var(--tomato);box-shadow:inset 0 3px 0 var(--tomato)}

section.view{padding:8px 0 24px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--tomato);color:var(--tomato-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn.wide{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* Semanas */
.week{margin-top:22px}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.weekhead h2{font-size:1.3rem}
.weekhead small{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.pill.kid{background:var(--kid-bg);color:var(--kid)}
.pill.carga{background:var(--carga-bg);color:var(--ink)}
.pill.ligera{background:var(--ligera-bg);color:var(--ligera)}
.pill.fixed{background:var(--line);color:var(--ink)}
.slot{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:4.2em 1fr;gap:10px}
.slot .day{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.05rem;line-height:1.1}
.slot .day small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:2px}
.slot .name{font-weight:700;font-size:1.02rem;background:none;border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.slot .meta{color:var(--muted);font-size:.86rem;margin-top:2px}
.slot .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.slot .thaw{margin-top:6px;font-size:.86rem;color:var(--ink);background:var(--bg);border-radius:8px;padding:5px 8px}
.slot .ops{margin-top:8px;display:flex;gap:6px}
.extra{border:1.5px dashed var(--line);background:transparent}
.empty{background:var(--surface);border-radius:14px;padding:22px;margin-top:18px}
.empty p{margin:6px 0 14px;color:var(--muted)}

/* Compra */
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.listtotal{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.listtotal h2{font-size:1.25rem}
.listtotal b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem}
.aisle{margin-top:16px}
.aisle h3{font-size:1rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);padding:10px 12px;border-radius:10px;margin-bottom:6px}
.item input{width:22px;height:22px;accent-color:var(--ligera);flex:none}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:var(--muted);font-size:.83rem}
.item.done .t{opacity:.45;text-decoration:line-through}
.item .p{font-weight:700;white-space:nowrap;text-align:right}
.item .p .up{display:block}
.mlink{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--bg);text-decoration:none;font-size:1.1rem}
.mlink:hover{background:var(--line)}
.shophint{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.guide{background:var(--surface);border-radius:14px;padding:14px;margin-top:22px}
.guide h3{font-size:1.1rem;margin-bottom:4px}
.guide p{margin:0 0 8px;color:var(--muted);font-size:.92rem}
.guide ul{margin:0;padding-left:18px}
.guide li{margin:4px 0}
.guide .add{color:var(--ligera);font-weight:700}
.guide .del{color:var(--warn);font-weight:700}
.guide .chg{color:var(--ink);font-weight:700}
.guide .btn{margin-top:10px}

/* Recetas */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.rcard{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;border:0;text-align:left}
.rcard .t b{display:block}
.rcard .t small{color:var(--muted)}
.rcard.no{opacity:.5}

/* Ajustes */
.card{background:var(--surface);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:1.15rem;margin-bottom:10px}
.field{margin:12px 0}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .hint{color:var(--muted);font-size:.86rem;margin-top:3px}
input[type=number],input[type=date],input[type=text],select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:400}
.fixed{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fixed small{color:var(--muted);display:block}
.prices .pr{display:grid;grid-template-columns:1fr 6.5em;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prices .pr small{color:var(--muted);display:block}
.prices input{padding:6px 8px;text-align:right}
.prices .pr .reset{border:0;background:none;padding:0;color:var(--tomato);font-weight:700;font-size:.8rem;text-decoration:underline}

/* Modal */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(10 14 20 / .55)}
.mod{padding:20px}
.mod h2{font-size:1.5rem;margin:4px 0 6px}
.mod .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mod .stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.mod .stats b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.mod .stats small{color:var(--muted)}
.mod ol{padding-left:20px}
.mod ol li{margin:6px 0}
.mod table{width:100%;border-collapse:collapse}
.mod td{padding:6px 0;border-top:1px solid var(--line)}
.mod td:last-child{text-align:right;color:var(--muted)}
.close{float:right;border:0;background:var(--bg);border-radius:50%;width:36px;height:36px;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Táper</h1>
      <div class="monthnav">
        <button id="prevM" aria-label="Mes anterior">‹</button>
        <span id="monthLabel"></span>
        <button id="nextM" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="ticket" aria-live="polite">
      <div class="row"><span class="big" id="spent">0 €</span><span class="of" id="budgetOf"></span></div>
      <div class="bar" id="bar"><i style="width:0"></i></div>
      <div class="note" id="budgetNote"></div>
    </div>
    <div class="pricedate" id="priceDate"></div>
  </header>
  <main id="main"><p class="loading">Cargando…</p></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="menu">Menú</button>
  <button data-tab="compra">Compra</button>
  <button data-tab="recetas">Recetas</button>
  <button data-tab="ajustes">Ajustes</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
/* ---------- Catálogo y recetas: se cargan de data/*.json ---------- */
// P[id] = [nombre, tamaño envase, unidad, precio estimado €, conservación, pasillo]
let P = {}, R = [], RX = {}, THAW = new Set(), MID = {};
const APP = {air:"Air fryer",horno:"Horno",vitro:"Vitro o fogones",micro:"Microondas"};
const GROUP = {carne:"Carne",pescado:"Pescado",legumbre:"Legumbre",huevo:"Huevo"};
function setData(prods,recs){
  P={};THAW=new Set();MID={};
  for(const p of prods){P[p.id]=[p.nombre,p.envase,p.unidad,p.precio_estimado,p.conservacion,p.pasillo];if(p.descongelar)THAW.add(p.id);if(p.mercadona_id)MID[p.id]=p.mercadona_id}
  R=recs.map(r=>({id:r.id,name:r.nombre,app:r.aparato,time:r.minutos,active:r.minutos_trabajo,type:r.tipo==="hidratos"?"c":"l",group:r.grupo,kid:!!r.gusta_ninos,prot:r.proteina,ing:r.ingredientes.map(i=>[i.producto,i.cantidad]),steps:r.pasos}));
  RX=Object.fromEntries(R.map(r=>[r.id,r]));
}

/* ---------- Precios de Mercadona (data/precios.json, actualizado cada domingo) ---------- */
// PR = {fecha, productos:{id:{precio, anterior, ...}}}; si no se puede descargar se usa la última copia guardada
let PR = null, prOffline = false;
function loadSavedPrices(){try{const raw=localStorage.getItem("taper-precios");return raw?JSON.parse(raw):null}catch(e){return null}}
const mprice=pid=>{const x=PR&&PR.productos&&PR.productos[pid];return x&&typeof x.precio==="number"?x:null};
function rise(pid){const x=mprice(pid);return x&&typeof x.anterior==="number"&&x.precio>x.anterior+0.004?x.precio-x.anterior:0}
const upTag=pid=>{const d=rise(pid);return d?` <span class="up" title="Ha subido respecto a la semana anterior">▲ +${eur(d)}</span>`:""};

/* ---------- Estado ---------- */
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DSHORT = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
const today=new Date();
const DEFAULT = {
  v:1, updatedAt:0,
  settings:{budget:180, basics:6, kidFactor:0.6, kidAnchor:iso(mondayOf(today)), training:[0,2,4], sunday:true, apps:["air","horno","vitro","micro"]},
  fixed:[], prices:{}, dislikes:[], plans:{}, checks:{}, base:null
};
let S = load();
let month = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
let tab = "menu";
let listSel = "mes";
let recFilter = "todas";

function load(){
  try{const raw=localStorage.getItem("taper-v1"); if(raw){const o=JSON.parse(raw); return merge(o)}}catch(e){}
  return structuredClone(DEFAULT);
}
function merge(o){const d=structuredClone(DEFAULT);return {...d,...o,settings:{...d.settings,...(o.settings||{})}}}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem("taper-v1",JSON.stringify(S))}catch(e){toast("No se ha podido guardar en el móvil")}
}

/* ---------- Copia de seguridad ---------- */
function exportBackup(){
  const data={app:"taper",version:1,exportado:new Date().toISOString(),estado:S,precios:PR};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="taper-copia-"+iso(new Date())+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Copia descargada");
}
function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result)}catch(e){toast("El archivo no es una copia válida");return}
    if(!o||o.app!=="taper"||!o.estado||!o.estado.settings){toast("El archivo no es una copia de Táper");return}
    const when=o.exportado?new Date(o.exportado).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}):"fecha desconocida";
    if(!confirm("¿Sustituir todos tus datos por la copia del "+when+"? Lo que tienes ahora se perderá."))return;
    S=merge(o.estado);save();
    if(o.precios&&!PR){PR=o.precios;try{localStorage.setItem("taper-precios",JSON.stringify(PR))}catch(e){}}
    render();toast("Copia restaurada");
  };
  rd.readAsText(file);
}

/* ---------- Utilidades ---------- */
const eur=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:n>=100?0:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Prioridad: precio corregido a mano > precio de Mercadona > estimación del catálogo
const price=pid=>S.prices[pid]!=null?S.prices[pid]:mprice(pid)?mprice(pid).precio:P[pid][3];
function fmtQty(q,u){if(u==="ud")return (Math.round(q*10)/10).toString().replace(".",",")+" ud";if(q>=1000)return (Math.round(q/100)/10).toString().replace(".",",")+(u==="g"?" kg":" l");return Math.round(q)+" "+u}
function monthName(m){const [y,mm]=m.split("-").map(Number);return new Date(y,mm-1,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"})}
function mondaysIn(m){const [y,mm]=m.split("-").map(Number);const out=[];const d=new Date(y,mm-1,1);while(d.getMonth()===mm-1){if(d.getDay()===1)out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
function isKidWeek(mon){const a=mondayOf(parseISO(S.settings.kidAnchor));const diff=Math.round((mon-a)/(7*864e5));return ((diff%2)+2)%2===0}
function shortDate(d){return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".","")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}

/* ---------- Planificador ---------- */
// Huecos: cenas de domingo (víspera) a jueves. Cada cena se cocina doble: la otra ración es el táper de la comida del día siguiente.
function slotDefs(){
  const tr=new Set(S.settings.training);
  const days=S.settings.sunday?[-1,0,1,2,3]:[0,1,2,3];
  return days.map(d=>({day:d,type:tr.has(d+1)?"c":"l"}));
}
function fixedFor(kid){return S.fixed.filter(f=>f.weeks==="todas"||(f.weeks==="hijo"&&kid)||(f.weeks==="solo"&&!kid))}
function dayToSlot(f){if(f.meal!=="cena")return null;if(f.day===6)return -1;if(f.day<=3)return f.day;return null}
function candidates(type,kid,exclude){
  return R.filter(r=>r.type===type&&S.settings.apps.includes(r.app)&&(!kid||r.kid)&&!S.dislikes.includes(r.id)&&!exclude.has(r.id));
}
function pickFor(def,kid,used,counts){
  let c=candidates(def.type,kid,used);
  if(!c.length) c=candidates(def.type,kid,new Set());
  if(!c.length) c=R.filter(r=>S.settings.apps.includes(r.app)&&(!kid||r.kid)&&!S.dislikes.includes(r.id));
  if(!c.length) c=R;
  const need={legumbre:2,pescado:2}, max={huevo:1,carne:2};
  const scored=c.map(r=>{let s=Math.random()*2;const n=counts[r.group]||0;
    if(need[r.group]&&n<need[r.group])s+=3;
    if(max[r.group]!=null&&n>=max[r.group])s-=4;
    return [s,r]}).sort((a,b)=>b[0]-a[0]);
  return scored[0][1];
}
function genWeek(mon,prevUsed){
  const kid=isKidWeek(mon);
  const fx=fixedFor(kid);
  const used=new Set(prevUsed), counts={};
  const slots=slotDefs().map(d=>({...d}));
  for(const s of slots){const f=fx.find(f=>dayToSlot(f)===s.day);if(f){s.fixed=f.id;if(f.recipe){s.recipe=f.recipe;used.add(f.recipe);const g=RX[f.recipe]?.group;if(g)counts[g]=(counts[g]||0)+1}}}
  for(const s of slots){if(s.fixed)continue;const r=pickFor(s,kid,used,counts);s.recipe=r.id;used.add(r.id);counts[r.group]=(counts[r.group]||0)+1}
  const extras=fx.filter(f=>dayToSlot(f)===null||!slots.some(s=>s.day===dayToSlot(f))).map(f=>f.id);
  return {monday:iso(mon),kid,slots,extras};
}
function balanceScore(plan){let s=0;for(const w of plan.weeks){const c={};for(const sl of w.slots){const r=RX[sl.recipe];if(r)c[r.group]=(c[r.group]||0)+1}s+=Math.min(c.legumbre||0,2)+Math.min(c.pescado||0,2)-Math.max(0,(c.carne||0)-2)-Math.max(0,(c.huevo||0)-1)}return s}
function generate(m){
  const mons=mondaysIn(m);let best=[];
  for(let t=0;t<70;t++){
    let prev=new Set();const weeks=[];
    for(const mon of mons){const w=genWeek(mon,prev);weeks.push(w);prev=new Set(w.slots.map(s=>s.recipe).filter(Boolean))}
    const plan={weeks};plan.cost=shopping(plan).total;plan.bal=balanceScore(plan);best.push(plan);
  }
  const ok=best.filter(p=>p.cost<=S.settings.budget);
  let pool=ok.length?ok:best.sort((a,b)=>a.cost-b.cost).slice(0,5);
  const maxBal=Math.max(...pool.map(p=>p.bal));pool=pool.filter(p=>p.bal===maxBal);
  const chosen=pool[Math.floor(Math.random()*pool.length)];
  delete chosen.cost;delete chosen.bal;
  return chosen;
}
function servingsFor(w){return 2+(w.kid?Number(S.settings.kidFactor):0)}

/* ---------- Lista de la compra ---------- */
function shopping(plan){
  const mes={}, weeks=plan.weeks.map(()=>({})), uses={};
  let extrasCost=0;
  const add=(bucket,pid,q)=>{bucket[pid]=(bucket[pid]||0)+q};
  plan.weeks.forEach((w,wi)=>{
    const sv=servingsFor(w);
    const run=(rid,serv,label)=>{const r=RX[rid];if(!r)return;for(const [pid,q] of r.ing){const qq=q*serv;const sh=P[pid][4];if(sh==="fresco")add(weeks[wi],pid,qq);else add(mes,pid,qq);
      if(sh==="congelar"){(uses[pid]=uses[pid]||[]).push({q:qq,label,name:r.name})}}};
    for(const s of w.slots){
      const f=s.fixed?S.fixed.find(x=>x.id===s.fixed):null;
      if(s.recipe)run(s.recipe,sv,"S"+(wi+1)+" "+DSHORT[(s.day+7)%7]);
      else if(f)extrasCost+=Number(f.cost)||0;
    }
    for(const fid of w.extras||[]){const f=S.fixed.find(x=>x.id===fid);if(!f)continue;
      if(f.recipe)run(f.recipe,1+(w.kid&&f.meal==="cena"?Number(S.settings.kidFactor):0),"S"+(wi+1)+" "+DSHORT[f.day]);
      else extrasCost+=Number(f.cost)||0}
  });
  const cost=b=>Object.entries(b).reduce((t,[pid,q])=>t+Math.ceil(q/P[pid][1]-0.03)*price(pid),0);
  const mesCost=cost(mes), wCosts=weeks.map(cost);
  const total=mesCost+wCosts.reduce((a,b)=>a+b,0)+extrasCost+Number(S.settings.basics||0);
  return {mes,weeks,mesCost,wCosts,extrasCost,total,uses};
}

function swap(wi,si){
  const plan=S.plans[month], w=plan.weeks[wi], s=w.slots[si];

  const counts={};w.slots.forEach((x,i)=>{if(i!==si&&RX[x.recipe]){const g=RX[x.recipe].group;counts[g]=(counts[g]||0)+1}});

let lastNow={};
function baseBlock(bucket){
  const now={};for(const [pid,q] of Object.entries(bucket))now[pid]=Math.ceil(q/P[pid][1]-0.03);
  lastNow=now;
  const b=S.base;
  if(!b)return `<div class="guide"><h3>Tu pedido en Mercadona</h3><p>Monta este pedido una vez en la app de Mercadona y guárdalo aquí. A partir de entonces solo verás lo que tienes que cambiar.</p><button class="btn small" id="saveBase">Guardar como mi pedido</button></div>`;
  const add=[],del=[],chg=[];
  for(const [pid,n] of Object.entries(now)){const o=b.items[pid]||0;if(!o)add.push([pid,n]);else if(o!==n)chg.push([pid,o,n])}
  for(const [pid,o] of Object.entries(b.items)){if(!now[pid]&&P[pid])del.push([pid,o])}
  const when=parseISO(b.savedAt).toLocaleDateString("es-ES",{day:"numeric",month:"long"});
  if(!add.length&&!del.length&&!chg.length)return `<div class="guide"><h3>Sin cambios</h3><p>Coincide con tu pedido guardado el ${when}. Repítelo tal cual desde tus pedidos anteriores en Mercadona.</p></div>`;
  let h=`<div class="guide"><h3>Cambios en tu pedido de Mercadona</h3><p>Abre tu pedido anterior (guardado el ${when}), pásalo al carrito y haz solo esto:</p><ul>`;
  for(const [pid,n] of add)h+=`<li><span class="add">Añadir</span> ${n} × ${esc(P[pid][0])}</li>`;
  for(const [pid,o,n] of chg)h+=`<li><span class="chg">${n>o?"Subir":"Bajar"}</span> ${esc(P[pid][0])}: de ${o} a ${n}</li>`;
  for(const [pid,o] of del)h+=`<li><span class="del">Quitar</span> ${esc(P[pid][0])} (tenías ${o})</li>`;
  return h+`</ul><button class="btn small" id="saveBase">Hecho, ya lo he cambiado en Mercadona</button></div>`;
}

      return `<div class="pr"><span>${esc(p[0])}${upTag(pid)}<small>${fmtQty(p[1],p[2])}${own?` · corregido a mano${m?` (Mercadona: ${eur(m.precio)}) <button class="reset" data-reset="${pid}">Usar el de Mercadona</button>`:` <button class="reset" data-reset="${pid}">Quitar corrección</button>`}`:m?" · Mercadona":" · estimado"}</small></span><input type="number" step="0.01" min="0" data-price="${pid}" value="${price(pid).toFixed(2)}" aria-label="Precio de ${esc(p[0])}"></div>`}).join("")}
  </div>
  <div class="card"><h2>Copia de seguridad</h2>
    <div class="hint" style="color:var(--muted)">Todo se guarda solo en este móvil. Descarga una copia de vez en cuando (y antes de cambiar de móvil) para no perder tus menús, ajustes y valoraciones.</div>
    <div class="actions"><button class="btn" id="exp">Exportar copia</button><button class="btn ghost" id="imp">Importar copia</button></div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
  </div></section>`;
  main.innerHTML=h;
  const num=(id,key)=>document.getElementById(id).onchange=e=>{st[key]=Math.max(0,Number(e.target.value)||0);save();render()};
  num("budget","budget");num("basics","basics");
  main.querySelectorAll("[data-tr]").forEach(c=>c.onchange=()=>{const d=Number(c.dataset.tr);st.training=c.checked?[...new Set([...st.training,d])]:st.training.filter(x=>x!==d);save();toast("Rehaz el mes para aplicarlo")});
  document.getElementById("sunday").onchange=e=>{st.sunday=e.target.checked;save();toast("Rehaz el mes para aplicarlo")};
  main.querySelectorAll("[data-app]").forEach(c=>c.onchange=()=>{const k=c.dataset.app;st.apps=c.checked?[...new Set([...st.apps,k])]:st.apps.filter(x=>x!==k);save()});
  document.getElementById("anchor").onchange=e=>{if(e.target.value){st.kidAnchor=e.target.value;save();toast("Rehaz el mes para aplicarlo")}};
  document.getElementById("kidf").onchange=e=>{st.kidFactor=Number(e.target.value);save();render()};
  const fxr=document.getElementById("fxr");
  const tog=()=>{const free=!fxr.value;document.getElementById("fxnameW").hidden=!free;document.getElementById("fxcostW").hidden=!free};tog();fxr.onchange=tog;
  document.getElementById("addfx").onclick=()=>{
    const recipe=fxr.value||null, name=document.getElementById("fxn").value.trim();
    if(!recipe&&!name){toast("Escribe el nombre del plato");return}
    S.fixed.push({id:"f"+Date.now(),recipe,name:recipe?"":name,cost:recipe?0:Number(document.getElementById("fxc").value)||0,day:Number(document.getElementById("fxd").value),meal:document.getElementById("fxm").value,weeks:document.getElementById("fxw").value});
    save();render();toast("Plato fijo añadido");
  };
  main.querySelectorAll("[data-delf]").forEach(b=>b.onclick=()=>{S.fixed=S.fixed.filter(f=>f.id!==b.dataset.delf);save();render()});
  main.querySelectorAll("[data-price]").forEach(i=>i.onchange=()=>{const v=Number(i.value);if(v>=0){S.prices[i.dataset.price]=v;save();render()}});
  main.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{delete S.prices[b.dataset.reset];save();render()});
  document.getElementById("exp").onclick=exportBackup;
  const f=document.getElementById("impFile");
  document.getElementById("imp").onclick=()=>f.click();
  f.onchange=()=>{if(f.files[0])importBackup(f.files[0]);f.value=""};
}

/* ---------- Navegación ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
function shiftMonth(n){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+n,1);month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");listSel="mes";render()}
document.getElementById("prevM").onclick=()=>shiftMonth(-1);
document.getElementById("nextM").onclick=()=>shiftMonth(1);
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

/* ---------- Arranque ---------- */
async function getJSON(url,fresh){const r=await fetch(url,fresh?{cache:"no-store"}:{});if(!r.ok)throw new Error(url+": "+r.status);return r.json()}
async function boot(){
  try{
    const [prods,recs]=await Promise.all([getJSON("data/productos.json"),getJSON("data/recetas.json")]);
    setData(prods.productos,recs.recetas);
  }catch(e){main.innerHTML=`<section class="view"><div class="empty"><h2>No se han podido cargar las recetas</h2><p>Comprueba la conexión y vuelve a abrir la app.</p></div></section>`;return}
  PR=loadSavedPrices();
  try{
    const fresh=await getJSON("data/precios.json?t="+Date.now(),true);
    if(fresh&&fresh.productos){PR=fresh;prOffline=false;try{localStorage.setItem("taper-precios",JSON.stringify(PR))}catch(e){}}
  }catch(e){prOffline=!!PR}
  render();
}
boot();
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
