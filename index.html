<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Táper</title>
<meta name="theme-color" content="#E4482B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Táper</h1>
      <div class="monthnav">
        <button id="prevM" aria-label="Mes anterior">‹</button>
        <span id="monthLabel"></span>
        <button id="nextM" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="ticket" aria-live="polite" hidden>
      <div class="row"><span class="big" id="spent">0 €</span><span class="of" id="budgetOf"></span></div>
      <div class="bar" id="bar"><i style="width:0"></i></div>
      <div class="note" id="budgetNote"></div>
    </div>
    <div class="pricedate" id="priceDate"></div>
  </header>
  <main id="main"><p class="loading">Cargando…</p></main>
</div>
<nav class="tabs" aria-label="Secciones" hidden><div class="in">
  <button data-tab="menu">Menú</button>
  <button data-tab="compra">Compra</button>
  <button data-tab="recetas">Recetas</button>
  <button data-tab="perfil">Perfil</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script src="js/base.js?v=3"></script>
<script src="js/datos.js?v=3"></script>
<script src="js/gustos.js?v=3"></script>
<script src="js/plan.js?v=3"></script>
<script src="js/compra.js?v=3"></script>
<script src="js/bienvenida.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
</body>
</html>
